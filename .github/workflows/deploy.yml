name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: troque pelo seu slug, o começo do seu e-mail com ponto virando hífen.
  SLUG: walyson-fidelis
  # TODO: a primeira porta da sua faixa. Veja em `gr-docker ajuda`.
  PORTA: 23300

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker stop gr-${{ env.SLUG }}-front" || true

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker stop gr-${{ env.SLUG }}-api" || true

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker stop gr-${{ env.SLUG }}-banco" || true

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker rm gr-${{ env.SLUG }}-front" || true

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker rm gr-${{ env.SLUG }}-api" || true

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker rm gr-${{ env.SLUG }}-banco" || true
            
      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network ls --meus | grep -q 'gr-${{ env.SLUG }}-dados' || gr-docker network create dados --interna"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network ls --meus | grep -q 'gr-${{ env.SLUG }}-web' || gr-docker network create web"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker volume ls --meus | grep -q 'gr-${{ env.SLUG }}-pgdata' || gr-docker volume create pgdata"

      - name: Subir banco, API e front
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run postgres:17-alpine --name banco --network dados -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' -e POSTGRES_DB=pokedex -v pgdata:/var/lib/postgresql/data -d"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run gr-atv2-api:1 --name api --network dados -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' -d"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network connect web api"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run gr-atv2-front:1 --name front --network web -e API=gr-${{ env.SLUG }}-api -e DEPLOY_SHA=${{ github.sha }} -p ${{ env.PORTA }}:80 -d"

      - name: Conferir que subiu
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker meus"
